<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Сияние над Мурманском</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="app.css">
  <script src="shim.js"></script>
</head>
<body>
  <header class="top">
    <div class="place">
      <span id="place" class="place-name">Мурманск</span>
      <span id="updated" class="place-meta"></span>
    </div>
    <div class="top-actions">
      <button id="refresh" class="btn" type="button">
        <svg class="btn-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.6 8a5.6 5.6 0 1 1-1.64-3.96" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12.6 1.6v2.9H9.7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="btn-label">Обновить</span>
      </button>
      <button id="settings" class="icon-btn" type="button" title="Настройки" aria-label="Настройки">
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.5v1.8M8 12.7v1.8M14.5 8h-1.8M3.3 8H1.5M12.6 3.4l-1.3 1.3M4.7 11.3l-1.3 1.3M12.6 12.6l-1.3-1.3M4.7 4.7 3.4 3.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div id="notice" class="notice" role="status" hidden></div>

  <main>
    <section id="hero" class="hero" aria-live="polite"></section>

    <section class="block" aria-labelledby="chart-title">
      <h2 id="chart-title" class="block-title">Шанс увидеть сияние по часам</h2>
      <div id="chart" class="chart"></div>
    </section>

    <section class="block" aria-labelledby="now-title">
      <h2 id="now-title" class="block-title">Обстановка сейчас</h2>
      <p id="now-status" class="now-status"></p>
      <dl id="readings" class="readings"></dl>
      <p id="ovation" class="note"></p>
    </section>

    <section class="block" aria-labelledby="events-title">
      <h2 id="events-title" class="block-title">Вспышки и выбросы за неделю</h2>
      <ol id="events" class="events"></ol>
    </section>

    <section class="block" aria-labelledby="nights-title">
      <h2 id="nights-title" class="block-title">Ночи</h2>
      <table id="nights" class="nights"></table>
    </section>
  </main>

  <footer id="footer" class="footer"></footer>

  <script type="module" src="app.js"></script>
</body>
</html>
